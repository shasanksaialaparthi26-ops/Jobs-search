server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - ${UI_ORIGIN:http://localhost:3000}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
            allowCredentials: false
      routes:
        - id: notification-delivery
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/notifications/**
        - id: application-tracking
          uri: ${APPLICATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/applications/**
        - id: resume-management
          uri: ${RESUME_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/resumes/**
        - id: user-management
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/jobs-search}

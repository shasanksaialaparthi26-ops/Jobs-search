services:
  application-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${APPLICATION_DB_NAME:-applications}
      POSTGRES_USER: ${APPLICATION_DB_USER:-applications}
      POSTGRES_PASSWORD: ${APPLICATION_DB_PASSWORD:-local-applications-password}
    ports:
      - "5432:5432"
    volumes:
      - application-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-local-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-local-minio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
  minio-setup:
    image: quay.io/minio/mc:RELEASE.2025-02-08T19-14-21Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done && mc mb --ignore-existing local/"$$S3_BUCKET"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-local-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-local-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-resumes}
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD before starting Keycloak}
    ports:
      - "8180:8080"
  keycloak-setup:
    image: quay.io/keycloak/keycloak:26.2
    depends_on:
      - keycloak
    entrypoint: ["/bin/bash", "/setup/configure-realm.sh"]
    environment:
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD before starting Keycloak}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET before starting Keycloak}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      JOBS_WEB_REDIRECT_URI: ${JOBS_WEB_REDIRECT_URI:-http://localhost:3000/*}
      JOBS_WEB_ORIGIN: ${JOBS_WEB_ORIGIN:-http://localhost:3000}
    volumes:
      - ./keycloak/configure-realm.sh:/setup/configure-realm.sh:ro
  ollama:
    image: ollama/ollama:0.6.8
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    depends_on:
      keycloak-setup:
        condition: service_completed_successfully
    environment:
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8180/realms/jobs-search}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/jobs-search/protocol/openid-connect/certs
      MAILGUN_BASE_URL: ${MAILGUN_BASE_URL:-https://api.mailgun.net}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_FROM_ADDRESS: ${MAILGUN_FROM_ADDRESS:-}
    ports:
      - "8084:8084"
volumes:
  minio-data:
  ollama-data:
  application-db-data:

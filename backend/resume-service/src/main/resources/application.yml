server:
  port: 8082

spring:
  application:
    name: resume-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/jobs-search}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

storage:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:resumes}
    access-key: ${S3_ACCESS_KEY_ID:local-minio}
    secret-key: ${S3_SECRET_ACCESS_KEY:local-minio-secret}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama3.2}

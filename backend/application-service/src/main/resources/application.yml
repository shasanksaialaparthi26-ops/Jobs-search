server:
  port: 8083

spring:
  application:
    name: application-service
  datasource:
    url: ${APPLICATION_DB_URL:jdbc:postgresql://localhost:5432/applications}
    username: ${APPLICATION_DB_USER:applications}
    password: ${APPLICATION_DB_PASSWORD:local-applications-password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/jobs-search}
